[package]
name = "aarch64-emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.5.49", features = ["derive"] }
crossterm = "0.29.0"
elf = "0.8.0"
fs = "0.0.5"
libloading = "0.8.9"
log = "0.4.28"
mlua = { version = "0.11.4", features = ["lua54"] }
ratatui = "0.29.0"

[[bin]]
name = "aarch64-emulator"
path = "src/main.rs"

[lib]
name = "aarch64_emulator"
path = "src/lib.rs"

